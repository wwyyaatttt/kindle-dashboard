name: render

on:
  # The 10-minute cadence comes from an external scheduler (cron-job.org) calling the
  # workflow_dispatch API, because GitHub's own cron often runs hours late. This hourly
  # schedule is only a fallback (and keeps the keepalive job running).
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: render/requirements.txt

      - run: pip install -r render/requirements.txt

      - name: Render
        env:
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
          DASH_LAT: ${{ secrets.DASH_LAT }}
          DASH_LON: ${{ secrets.DASH_LON }}
          DASH_PLACE: ${{ secrets.DASH_PLACE }}
          NWS_GRID: ${{ secrets.NWS_GRID }}
          NWS_STATION: ${{ secrets.NWS_STATION }}
        run: cd render && python render.py "$RUNNER_TEMP/out"

      # Pages artifacts in a public repo can be downloaded by any GitHub user, so only
      # encrypted files are published. The Kindle holds the same key (key.txt).
      # -md sha256 without -pbkdf2 keeps the format readable by the Kindle's OpenSSL 1.0.1g.
      - name: Encrypt
        env:
          DASH_KEY: ${{ secrets.DASH_KEY }}
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: |
          # Separate checks: under 'bash -e' a failure early in an && list would not stop the step,
          # and openssl happily encrypts with an empty passphrase.
          [ "${#DASH_KEY}" -ge 32 ] || { echo "::error::DASH_KEY secret is missing or shorter than 32 characters"; exit 1; }
          [ -n "$DASH_TOKEN" ] || { echo "::error::DASH_TOKEN secret is missing"; exit 1; }
          mkdir -p "site/$DASH_TOKEN"
          touch site/.nojekyll site/index.html
          for f in dashboard.gz:dashboard.bin meta.txt:meta.bin; do
            openssl enc -aes-256-cbc -md sha256 -salt -pass env:DASH_KEY \
              -in "$RUNNER_TEMP/out/${f%%:*}" -out "site/$DASH_TOKEN/${f##*:}" 2>/dev/null
          done
          ls -la "site/$DASH_TOKEN"

      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 1
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      # Not actions/deploy-pages: it labels every deployment with the commit SHA, and Pages
      # treats a repeat label as "already live" and publishes nothing (seen 2026-11-08: twelve
      # hours of green deploys with no change). A unique label per run avoids that.
      - uses: actions/github-script@v9
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          script: |
            const { owner, repo } = context.repo
            const oidc_token = await core.getIDToken()
            const { data: dep } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: `${context.sha}-${context.runId}-${context.runAttempt}`,
              oidc_token,
            })
            core.info(`deployment ${dep.id} created, waiting for it to go live`)
            const sleep = ms => new Promise(r => setTimeout(r, ms))
            for (let i = 0; i < 60; i++) {
              await sleep(5000)
              const { data: s } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id: dep.id })
              core.info(`status: ${s.status}`)
              if (s.status === 'succeed') return
              if (['deployment_failed', 'deployment_content_failed', 'deployment_attempt_error', 'deployment_lost', 'deployment_cancelled'].includes(s.status)) {
                core.setFailed(`Pages deployment ended with status ${s.status}`)
                return
              }
            }
            core.setFailed('Pages deployment did not finish within 5 minutes')

  # Public repos get scheduled workflows switched off after 60 days without commits;
  # re-enabling through the API keeps the timer from running out.
  keepalive:
    needs: [build, deploy]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/render.yml/enable" || echo "::warning::keepalive enable call failed"
