name: render

on:
  # The 10-minute cadence comes from an external scheduler (cron-job.org) calling the
  # workflow_dispatch API, because GitHub's own cron often runs hours late. This hourly
  # schedule is only a fallback (and keeps the keepalive job running).
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Renders and encrypts. This job runs third-party code (pip packages), so it gets a
  # read-only token: nothing here can write to the repository.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      meta_sha256: ${{ steps.encrypt.outputs.meta_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: render/requirements.txt

      - run: pip install -r render/requirements.txt

      - name: Render
        env:
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
          DASH_LAT: ${{ secrets.DASH_LAT }}
          DASH_LON: ${{ secrets.DASH_LON }}
          DASH_PLACE: ${{ secrets.DASH_PLACE }}
          NWS_GRID: ${{ secrets.NWS_GRID }}
          NWS_STATION: ${{ secrets.NWS_STATION }}
        run: cd render && python render.py "$RUNNER_TEMP/out"

      # Pages artifacts in a public repo can be downloaded by any GitHub user, so only
      # encrypted files are published. The Kindle holds the same key (key.txt).
      # -md sha256 without -pbkdf2 keeps the format readable by the Kindle's OpenSSL 1.0.1g.
      - name: Encrypt
        id: encrypt
        env:
          DASH_KEY: ${{ secrets.DASH_KEY }}
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: |
          # Separate checks: under 'bash -e' a failure early in an && list would not stop the step,
          # and openssl happily encrypts with an empty passphrase.
          [ "${#DASH_KEY}" -ge 32 ] || { echo "::error::DASH_KEY secret is missing or shorter than 32 characters"; exit 1; }
          [ -n "$DASH_TOKEN" ] || { echo "::error::DASH_TOKEN secret is missing"; exit 1; }
          mkdir -p "site/$DASH_TOKEN"
          touch site/.nojekyll site/index.html
          for f in dashboard.gz:dashboard.bin meta.txt:meta.bin; do
            openssl enc -aes-256-cbc -md sha256 -salt -pass env:DASH_KEY \
              -in "$RUNNER_TEMP/out/${f%%:*}" -out "site/$DASH_TOKEN/${f##*:}" 2>/dev/null
          done
          echo "meta_sha256=$(sha256sum "site/$DASH_TOKEN/meta.bin" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 1

  # Deploys under a fresh marker commit and verifies the live site. Only official actions run
  # here, so this is the job that may write to the repository (the deploy-marker branch; a
  # ruleset keeps main out of reach of this token).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          META_SHA256: ${{ needs.build.outputs.meta_sha256 }}
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        with:
          script: |
            const deploy = require('./.github/scripts/deploy.js')
            await deploy({ github, context, core })

  # Hourly housekeeping, on the schedule event only:
  #  - public repos get scheduled workflows switched off after 60 days without commits;
  #    re-enabling through the API keeps the timer from running out
  #  - every render leaves a deployment record; keep the newest 30 and delete the rest
  keepalive:
    needs: [build, deploy]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      deployments: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/render.yml/enable" || echo "::warning::keepalive enable call failed"
          gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=100" --jq '.[30:][].id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/deployments/$id" >/dev/null 2>&1 || \
            { gh api -X POST "repos/${{ github.repository }}/deployments/$id/statuses" -f state=inactive >/dev/null 2>&1 &&
              gh api -X DELETE "repos/${{ github.repository }}/deployments/$id" >/dev/null 2>&1; } || true
          done
